# Starship prompt — lavender rice to match the serpantinum matugen theme.
# Icons rely on a Nerd Font (system installs Iosevka NF; kitty falls back
# per glyph by default).

format = "$directory$git_branch$git_status$cmd_duration$character"
add_newline = false

[directory]
style = "bold #cba6f7"
read_only = " 🔒"
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 2
truncation_symbol = "…/"
home_symbol = "󰋜 ~"
# pretty glyphs for common folders along the path
substitutions = { "assets" = "󰈙 assets", "Documents" = " ", "Downloads" = " ", "Music" = " 󰎈", "Pictures" = " ", "Videos" = " " }

[git_branch]
format = "[[](#45475a)[$branch](bold #c4a7e7)[](#45475a) ]"
truncation_symbol = ""

[git_status]
format = "[$all_status$ahead_behind](#f38ba8) "
conflicted = ""
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${count}"
deleted = "✘ "
untracked = "… "
stashed = ""
modified = "! "
style = "#f38ba8"

[cmd_duration]
min_time = 2000
format = "[ 󰅟 $duration ](#f9e2af)"
show_milliseconds = false

[character]
success_symbol = "[❯](bold #cba6f7)"
error_symbol = "[❯](bold #f38ba8)"
vicmd_symbol = "[❮](bold #89b4fa)"

# quiet down the modules that add noise in this rice
[aws]
disabled = true
[battery]
disabled = true
[conda]
disabled = true
[docker_context]
disabled = true
[golang]
disabled = true
[java]
disabled = true
[nodejs]
disabled = true
[package]
disabled = true
[python]
disabled = true
